name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vX.Y.Z or legacy X.Y.Z)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
      release_version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and check out the release tag
        id: tag
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "The release tag is empty." >&2
            exit 1
          fi

          if [[ "$RELEASE_EVENT" == "push" && "$RELEASE_TAG" != v* ]]; then
            echo "Tag-triggered releases must use a v-prefixed tag." >&2
            exit 1
          fi

          if ! git check-ref-format "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Invalid Git tag: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "The tag does not exist in this repository: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/master"; then
            echo "The release tag must identify a commit from master." >&2
            exit 1
          fi
          git checkout --detach "$tag_commit"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify the tag against the static project version
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import ast
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project.get("version")
          dynamic = project.get("dynamic", [])
          tag = os.environ["RELEASE_TAG"]
          tag_version = tag[1:] if tag.startswith("v") else tag

          if "version" in dynamic or not isinstance(version, str):
              raise SystemExit("[project].version must be defined statically in pyproject.toml")
          if not version or version != version.strip() or "\n" in version or "\r" in version:
              raise SystemExit("[project].version is not a safe, non-empty version string")
          if tag_version != version:
              raise SystemExit(
                  f"Tag {tag!r} resolves to version {tag_version!r}, "
                  f"but pyproject.toml declares {version!r}"
              )

          init_tree = ast.parse(
              Path("upref/__init__.py").read_text(encoding="utf-8"),
              filename="upref/__init__.py",
          )
          source_fallbacks = [
              node.value.value
              for node in ast.walk(init_tree)
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              )
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          ]
          if source_fallbacks != [version]:
              raise SystemExit(
                  "The source-tree __version__ fallback must occur once and match "
                  f"project.version; found {source_fallbacks!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

      - name: Install test and build tools
        run: >-
          python -m pip install --editable ".[test]"
          "build>=1.2" "twine>=5"

      - name: Run the test suite
        run: python -m pytest

      - name: Build the wheel and source distribution once
        run: python -m build --outdir release-bundle/dist

      - name: Check distribution metadata
        run: python -m twine check release-bundle/dist/*

      - name: Verify the distribution set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          directory = Path("release-bundle/dist")
          wheels = list(directory.glob("*.whl"))
          source_distributions = list(directory.glob("*.tar.gz"))
          unexpected = [
              path
              for path in directory.iterdir()
              if path not in wheels and path not in source_distributions
          ]

          if len(wheels) != 1 or len(source_distributions) != 1 or unexpected:
              raise SystemExit(
                  "Expected exactly one wheel and one .tar.gz source distribution; "
                  f"found wheels={wheels}, source distributions={source_distributions}, "
                  f"unexpected={unexpected}"
              )
          PY

      - name: Smoke-test the wheel in a clean environment
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          smoke_python="$RUNNER_TEMP/upref-release-venv/bin/python"
          python -m venv "$RUNNER_TEMP/upref-release-venv"
          "$smoke_python" -m pip install \
            --disable-pip-version-check release-bundle/dist/*.whl
          "$smoke_python" -m pip check
          (
          cd "$RUNNER_TEMP"
          "$smoke_python" - <<'PY'
          import os
          from importlib.metadata import version

          import upref

          installed_version = version("upref")
          expected_version = os.environ["RELEASE_VERSION"]
          if installed_version != expected_version:
              raise SystemExit(
                  f"Installed wheel version {installed_version!r} does not match "
                  f"the release version {expected_version!r}"
              )
          PY
          )

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-bundle
        run: sha256sum -- dist/*.whl dist/*.tar.gz > SHA256SUMS

      - name: Upload immutable release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: release-bundle/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/upref
    permissions:
      id-token: write

    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release-bundle

      - name: Verify distribution checksums
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS

      - name: Publish the exact distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: release-bundle/dist/

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the published distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: release-bundle

      - name: Verify distribution checksums
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS

      - name: Create the GitHub Release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            release-bundle/dist/*.whl \
            release-bundle/dist/*.tar.gz \
            release-bundle/SHA256SUMS
