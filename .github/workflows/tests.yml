name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Check formatting and lint
        run: |
          python -m ruff format --check upref tests examples scripts docs/conf.py
          python -m ruff check upref tests examples scripts docs/conf.py
          python -m mypy upref examples
      - name: Run tests
        run: python -m pytest

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and documentation tools
        run: python -m pip install -e ".[docs]"
      - name: Build documentation with strict references
        run: python -m sphinx -E -a -W --keep-going -b html docs docs/_build/html
