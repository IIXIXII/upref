[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upref"
version = "2.1.0"
description = "Small, explicit, and safe per-user configuration storage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Florent Tournois" },
]
keywords = ["configuration", "preferences", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "platformdirs>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["wxPython>=4.2"]
test = [
    "mypy>=2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
    "types-PyYAML>=6",
]
docs = ["myst-parser>=2", "sphinx>=7", "sphinx-rtd-theme>=2"]
dev = [
    "build>=1.2",
    "mypy>=2",
    "myst-parser>=2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "twine>=5",
    "types-PyYAML>=6",
    "vulture>=2",
]

[project.urls]
Documentation = "https://upref.readthedocs.io/"
Repository = "https://github.com/IIXIXII/upref"
Issues = "https://github.com/IIXIXII/upref/issues"

[tool.setuptools.packages.find]
include = ["upref*"]

[tool.setuptools.package-data]
upref = ["py.typed", "resources/*.ico"]

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["upref"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
