# content of pytest.ini

[pytest]
minversion = 7.0

# Collecte des tests
testpaths =
    tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclusions de répertoires
norecursedirs =
    .svn
    .git
    .venv
    dist
    build
    docs
    config
    .pytest_cache
    .hypothesis

# Avertissements
filterwarnings =
    error

markers =
    gui: native wxPython integration tests (opt in with UPREF_RUN_GUI_TESTS=1)

# Options par défaut
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    --cov=upref
    --cov-report=term-missing
    
